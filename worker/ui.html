<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exit IP Probe</title>
  <style>
    :root {
      --bg: #0b0f17;
      --card: #121826;
      --border: #232d42;
      --text: #e6edf7;
      --muted: #8b9bb4;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --ok: #10b981;
      --err: #ef4444;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .container {
      max-width: 920px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }
    .card {
      min-width: 0; /* let wide tables scroll inside .table-wrap instead of widening the grid */
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge {
      font-size: 12px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
    .row {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    input, textarea {
      width: 100%;
      background: #0b101b;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: var(--accent);
    }
    textarea {
      min-height: 150px;
      resize: vertical;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover:not(:disabled) {
      background: var(--accent-hover);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status {
      font-size: 13px;
      color: var(--muted);
    }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
    .status.warn { color: var(--warn); }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    th {
      color: var(--muted);
      font-weight: 500;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: #0b101b;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .hidden { display: none; }
    .table-wrap { overflow-x: auto; }
    .table-wrap table { min-width: 760px; }
    .ip-line { display: flex; align-items: center; gap: 6px; }
    .fam { font-size: 11px; color: var(--muted); width: 18px; flex: none; }
    .exit + .exit { margin-top: 8px; }
    .exit-geo { padding-left: 24px; font-size: 12px; color: var(--muted); margin-top: 2px; }
    .exit-geo .tag { margin-left: 2px; }
    .nowrap { white-space: nowrap; }
    .tag {
      display: inline-block;
      font-size: 11px;
      line-height: 1.6;
      padding: 0 6px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      white-space: nowrap;
    }
    .tag.ok { color: var(--ok); border-color: rgba(16, 185, 129, 0.4); }
    .tag.warn { color: var(--warn); border-color: rgba(245, 158, 11, 0.4); }
    .tag.err { color: var(--err); border-color: rgba(239, 68, 68, 0.4); }
    .tag.info { color: #93c5fd; border-color: rgba(59, 130, 246, 0.4); }
    .sub { font-size: 12px; color: var(--muted); }
    .err-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; color: var(--err); }
    details summary { cursor: pointer; font-size: 12px; color: var(--muted); }
    details pre {
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 12px;
      margin: 6px 0 0;
      padding: 8px;
      background: #0b101b;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    a { color: #93c5fd; }
    .meta-line { margin-top: 10px; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>
        <span>节点落地 IP 探测</span>
        <span class="badge">CF Worker + GitHub Actions</span>
      </h1>
      <div class="row">
        <input id="token" type="password" placeholder="API_TOKEN（访问密码）" autocomplete="off" />
      </div>
      <textarea
        id="input"
        placeholder="粘贴 Clash YAML 节点行（如 - { name: ..., type: hysteria2, ... }）或分享链接（hysteria2:// / vless:// / trojan:// / ss:// / vmess:// / tuic://，每行一个）；需要前置节点时在节点上加 dialer-proxy: 前置节点名"
      ></textarea>
      <div class="actions">
        <button id="submitBtn">开始探测</button>
        <span id="status" class="status"></span>
      </div>
    </div>

    <div id="resultCard" class="card hidden">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>节点</th>
              <th>落地出口（IP · 归属 · 网络）</th>
              <th>入口关系</th>
              <th>耗时</th>
              <th>状态</th>
            </tr>
          </thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>
      <div id="metaLine" class="meta-line"></div>
    </div>
  </div>

  <script>
    const tokenEl = document.getElementById('token');
    const inputEl = document.getElementById('input');
    const submitBtn = document.getElementById('submitBtn');
    const statusEl = document.getElementById('status');
    const resultCard = document.getElementById('resultCard');
    const resultBody = document.getElementById('resultBody');
    const metaLine = document.getElementById('metaLine');

    const savedToken = sessionStorage.getItem('probe_api_token');
    if (savedToken) tokenEl.value = savedToken;

    let pollTimer = null;

    function setStatus(text, cls = '') {
      statusEl.textContent = text;
      statusEl.className = 'status ' + cls;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    const RELATION = {
      direct: ['直连', 'ok', '入口 IP 即落地 IP'],
      same_network: ['同网段', 'info', '入口与落地同属一个 ASN，但 IP 不同（多 IP 出口或同机房转发）'],
      relay: ['中转', 'warn', '入口与落地属于不同网络（中转 / 隧道 / 分离出口）'],
      cdn: ['CDN', 'info', '入口是 CDN 边缘节点，落地是后端服务器'],
      unknown: ['未知', '', '缺少入口或落地信息'],
    };
    const ECH_LABEL = { doh: 'ECH·DoH', inline: 'ECH·内置', dns: 'ECH·DNS' };

    function tag(text, cls = '', title = '') {
      return `<span class="tag ${cls}"${title ? ` title="${escapeHtml(title)}"` : ''}>${escapeHtml(text)}</span>`;
    }

    function exitTags(exit) {
      const tags = [];
      if (exit.warp) tags.push(tag('WARP', 'info', '经 Cloudflare WARP 出口'));
      if (typeof exit.residential === 'boolean') {
        tags.push(exit.residential
          ? tag('住宅', 'ok', 'ippure：住宅 IP')
          : tag('非住宅', 'warn', 'ippure：非住宅（机房 / 商业）IP'));
      } else if (exit.hosting === true) {
        tags.push(tag('机房', 'warn', 'ip-api 标记为托管 / 数据中心 IP'));
      } else if (exit.hosting === false && !exit.warp) {
        tags.push(tag('非机房', 'ok', 'ip-api 未标记为数据中心 IP'));
      }
      if (typeof exit.broadcast === 'boolean') {
        tags.push(exit.broadcast
          ? tag('广播', 'warn', 'ippure：广播 IP（注册地与实际使用地不一致）')
          : tag('原生', 'ok', 'ippure：原生 IP（注册地与实际使用地一致）'));
      }
      if (typeof exit.fraud_score === 'number') {
        const cls = exit.fraud_score <= 30 ? 'ok' : exit.fraud_score <= 60 ? 'warn' : 'err';
        tags.push(tag(`风险 ${exit.fraud_score}`, cls, 'ippure fraudScore（0–100，越低越干净）'));
      }
      if (exit.mobile) tags.push(tag('移动网络', 'info'));
      if (exit.proxy) tags.push(tag('代理/VPN', 'warn', 'ip-api 标记为代理 / VPN / Tor 出口'));
      return tags.join(' ');
    }

    function exitBlock(fam, item) {
      const label = fam === 'ipv4' ? 'v4' : 'v6';
      const exit = item[fam];
      if (!exit) {
        const code = item.family_errors?.[fam]?.code || '';
        return `<div class="exit"><div class="ip-line"><span class="fam">${label}</span>
          <span class="sub" title="${escapeHtml(code)}">无 ${fam === 'ipv4' ? 'IPv4' : 'IPv6'} 出口</span></div></div>`;
      }
      const pref = item.preferred === fam ? tag('默认', 'ok', '访问双栈网站时优先走这个出口') : '';
      const place = [exit.country_code || exit.country, exit.city || exit.region].filter(Boolean).join(' · ');
      const net = [exit.isp || exit.org, exit.asn ? exit.asn.split(' ')[0] : ''].filter(Boolean).join(' · ');
      const geo = [place, net].filter(Boolean).join(' · ') || '归属未知';
      return `<div class="exit">
        <div class="ip-line"><span class="fam">${label}</span><code>${escapeHtml(exit.ip)}</code>${pref}</div>
        <div class="exit-geo">${escapeHtml(geo)} ${exitTags(exit)}</div>
      </div>`;
    }

    function exitsCell(item) {
      if (!item.ok) return '-';
      if (!('ipv4' in item) && !('ipv6' in item)) {
        // Results from an older Runner: single exit IP with best-effort geo.
        const geo = [item.country, item.city, item.isp].filter(Boolean).join(' · ');
        return `<code>${escapeHtml(item.exit_ip || '-')}</code><div class="sub">${escapeHtml(geo)}</div>`;
      }
      return exitBlock('ipv4', item) + exitBlock('ipv6', item);
    }

    function relationCell(item) {
      const entryIps = item.entry?.ips || [];
      const entryLine = entryIps.length
        ? `<div class="sub">入口 ${entryIps.slice(0, 2).map(escapeHtml).join(', ')}${entryIps.length > 2 ? ' …' : ''}</div>`
        : item.entry?.error ? `<div class="sub">入口解析失败 (${escapeHtml(item.entry.error)})</div>` : '';
      if (!item.ok) return entryLine || '-';
      const [label, cls, title] = RELATION[item.relation] || RELATION.unknown;
      const edge = item.entry?.cdn_edge === 'cloudflare'
        ? '<div class="sub" title="入口 IP 的 ASN 不是 Cloudflare，但由 Cloudflare 边缘应答（BYOIP / 优选 IP）">Cloudflare 优选 IP</div>'
        : '';
      return `${tag(label, cls, title)}${entryLine}${edge}`;
    }

    function statusCell(item) {
      const ech = item.ech ? ' ' + tag(ECH_LABEL[item.ech] || 'ECH', 'info', 'ECH 配置来源') : '';
      if (item.ok) return `<span class="status ok">成功</span>${ech}`;
      const detail = item.detail
        ? `<details><summary>详情</summary><pre>${escapeHtml(item.detail)}</pre></details>`
        : '';
      return `<div class="err-code">${escapeHtml(item.error_code || 'failed')}</div>
        <div class="status err" style="font-size:12px">${escapeHtml(item.error || '失败')}</div>${ech}${detail}`;
    }

    function timingCell(item) {
      if (item.latency_ms == null) return '-';
      const t = item.timings || {};
      const parts = [
        t.core_ready_ms != null ? `内核就绪 ${t.core_ready_ms}ms` : '',
        t.ipv4_ms != null ? `IPv4 ${t.ipv4_ms}ms` : '',
        t.ipv6_ms != null ? `IPv6 ${t.ipv6_ms}ms` : '',
        t.dual_ms != null ? `双栈 ${t.dual_ms}ms` : '',
      ].filter(Boolean).join('\n');
      return `<span class="nowrap" title="${escapeHtml(parts)}">${item.latency_ms} ms</span>`;
    }

    function renderResults(data) {
      const results = data.results || [];
      resultCard.classList.remove('hidden');
      resultBody.innerHTML = results.map((item, idx) => `<tr>
          <td>${idx + 1}</td>
          <td>${escapeHtml(item.name || '-')}<div class="sub"><code>${escapeHtml(item.type || '-')}</code></div>${item.via ? `<div class="sub" title="dialer-proxy：经前置节点连接">经 ${escapeHtml(item.via)}</div>` : ''}</td>
          <td>${exitsCell(item)}</td>
          <td>${relationCell(item)}</td>
          <td>${timingCell(item)}</td>
          <td>${statusCell(item)}</td>
        </tr>`).join('');
      renderMeta(data);
    }

    function renderMeta(data) {
      const m = data.meta || {};
      const parts = [];
      if (data.run_url) parts.push(`<a href="${escapeHtml(data.run_url)}" target="_blank" rel="noopener">GitHub Actions 运行记录</a>`);
      if (m.core_version) parts.push(`内核 ${escapeHtml(m.core)} ${escapeHtml(m.core_version)}`);
      if (m.runner_ipv6 === false) parts.push('Runner 无 IPv6');
      if (Array.isArray(m.geo_sources) && m.geo_sources.length) parts.push(`归属地来源 ${m.geo_sources.map(escapeHtml).join(' / ')}`);
      if (typeof data.duration_ms === 'number') parts.push(`Runner 探测耗时 ${data.duration_ms} ms`);
      metaLine.innerHTML = parts.join(' · ');
    }

    async function pollResult(taskId, token, startedAt) {
      const elapsedSec = Math.round((Date.now() - startedAt) / 1000);
      if (elapsedSec > 180) {
        setStatus('探测超时（超过 180 秒未收到回调）', 'err');
        submitBtn.disabled = false;
        return;
      }

      try {
        const res = await fetch(`/result?task_id=${encodeURIComponent(taskId)}`, {
          headers: { Authorization: `Bearer ${token}` },
          cache: 'no-store',
        });
        const data = await res.json();
        if (!res.ok) {
          setStatus(data.error || `查询失败 (${res.status})`, 'err');
          submitBtn.disabled = false;
          return;
        }
        if (data.status === 'queued' || data.status === 'running') {
          const phase = data.status === 'running'
            ? 'Runner 已领取任务，正在探测…'
            : '等待 GitHub Runner 启动…';
          setStatus(`${phase} 已等待 ${elapsedSec}s`, 'warn');
          if (data.run_url) {
            statusEl.insertAdjacentHTML('beforeend', ` <a href="${escapeHtml(data.run_url)}" target="_blank" rel="noopener">查看运行</a>`);
          }
          pollTimer = setTimeout(() => pollResult(taskId, token, startedAt), 2500);
          return;
        }
        if (data.status === 'done') {
          const okCount = (data.results || []).filter((r) => r.ok).length;
          setStatus(`完成：${okCount}/${(data.results || []).length} 成功（总耗时 ${elapsedSec}s）`, 'ok');
          renderResults(data);
          submitBtn.disabled = false;
          return;
        }
        setStatus(`任务失败：${data.error || '未知错误'}`, 'err');
        submitBtn.disabled = false;
      } catch (err) {
        setStatus(`轮询异常：${err.message}`, 'warn');
        pollTimer = setTimeout(() => pollResult(taskId, token, startedAt), 3000);
      }
    }

    submitBtn.addEventListener('click', async () => {
      if (pollTimer) clearTimeout(pollTimer);
      const token = tokenEl.value.trim();
      // Keep indentation: only drop leading blank lines and trailing whitespace.
      const input = inputEl.value.replace(/^(?:[ \t]*\r?\n)+/, '').trimEnd();
      if (!token) return setStatus('请输入 API_TOKEN', 'err');
      if (!input.trim()) return setStatus('请输入节点配置', 'err');

      sessionStorage.setItem('probe_api_token', token);
      submitBtn.disabled = true;
      resultCard.classList.add('hidden');
      setStatus('正在加密提交并触发 GitHub Actions…', 'warn');

      try {
        const res = await fetch('/probe', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({ input }),
        });
        const data = await res.json();
        if (!res.ok) {
          setStatus(data.error || `提交失败 (${res.status})`, 'err');
          submitBtn.disabled = false;
          return;
        }
        setStatus(`已排队 (${data.task_id.slice(0, 8)})，等待 Runner 启动…`, 'warn');
        pollResult(data.task_id, token, Date.now());
      } catch (err) {
        setStatus(`请求异常：${err.message}`, 'err');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
